name: Sync MapsetVerifier content

on:
    workflow_dispatch:
    repository_dispatch:
        types:
            - mapsetverifier-release

permissions:
    contents: write
    pull-requests: write

env:
    SYNC_BRANCH: sync/content-update

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout website repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve MapsetVerifier release tag
              id: tag
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  is_sync_compatible_tag() {
                    local repo="$1"
                    local tag="$2"
                    gh api "repos/${repo}/contents/scripts/export-checks-metadata.sh?ref=${tag}" >/dev/null 2>&1
                  }

                  is_prerelease_tag() {
                    local repo="$1"
                    local tag="$2"
                    local prerelease
                    prerelease=$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.prerelease')
                    case "${prerelease,,}" in
                      true|1) return 0 ;;
                      *) return 1 ;;
                    esac
                  }

                  pick_stable_compare_tag() {
                    local repo="$1"
                    local stable_tag
                    stable_tag=$(gh api "repos/${repo}/releases" --paginate \
                      --jq '[.[] | select(.prerelease == false)] | first | .tag_name')
                    if [ -z "$stable_tag" ] || [ "$stable_tag" = "null" ]; then
                      echo "No stable release found for beta comparison" >&2
                      return 1
                    fi
                    if ! is_sync_compatible_tag "$repo" "$stable_tag"; then
                      echo "Latest stable (${stable_tag}) lacks website sync tooling; skipping beta comparison" >&2
                      return 1
                    fi
                    echo "$stable_tag"
                  }

                  REPO=$(node -p "JSON.parse(require('fs').readFileSync('app/data/metadata.json','utf8')).repository.replace(/.*github\\.com\\//,'').replace(/\\.git$/,'')")

                  if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
                    TAG="${{ github.event.client_payload.tag }}"
                    DISPATCH_PRERELEASE="${{ github.event.client_payload.prerelease }}"
                    echo "repository_dispatch payload:"
                    echo "  tag=${TAG}"
                    echo "  prerelease=${DISPATCH_PRERELEASE}"
                    if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
                      echo "repository_dispatch payload is missing client_payload.tag"
                      exit 1
                    fi
                  else
                    TAG=$(gh api "repos/${REPO}/releases" --paginate \
                      --jq '[.[]] | first | .tag_name')
                  fi

                  if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
                    echo "No matching release found for repos/${REPO}"
                    exit 1
                  fi
                  if ! is_sync_compatible_tag "$REPO" "$TAG"; then
                    echo "Resolved tag ${TAG} is not compatible with website sync (missing export tooling)."
                    exit 1
                  fi

                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Resolved clone tag: $TAG"

                  STABLE_TAG=""
                  if is_prerelease_tag "$REPO" "$TAG"; then
                    if STABLE_TAG=$(pick_stable_compare_tag "$REPO"); then
                      echo "Prerelease clone; stable comparison tag: ${STABLE_TAG}"
                    else
                      STABLE_TAG=""
                    fi
                  else
                    echo "Stable clone; no beta comparison needed"
                  fi
                  echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"

            - name: Checkout MapsetVerifier at release tag
              uses: actions/checkout@v4
              with:
                  repository: Naxesss/MapsetVerifier
                  ref: ${{ steps.tag.outputs.tag }}
                  path: vendor/MapsetVerifier

            - name: Checkout MapsetVerifier stable for beta comparison
              if: steps.tag.outputs.stable_tag != ''
              uses: actions/checkout@v4
              with:
                  repository: Naxesss/MapsetVerifier
                  ref: ${{ steps.tag.outputs.stable_tag }}
                  path: vendor/MapsetVerifier-stable

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.x"

            - name: Sync content
              env:
                  MAPSETVERIFIER_ROOT: ${{ github.workspace }}/vendor/MapsetVerifier
                  WORKSPACE_ROOT: ${{ github.workspace }}
                  SYNC_CLONE_TAG: ${{ steps.tag.outputs.tag }}
                  STABLE_COMPARE_TAG: ${{ steps.tag.outputs.stable_tag }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if [ -n "${STABLE_COMPARE_TAG}" ]; then
                    export MAPSETVERIFIER_STABLE_ROOT="${GITHUB_WORKSPACE}/vendor/MapsetVerifier-stable"
                  fi
                  node scripts/sync-content.mjs

            - name: Verify non-check assets preserved
              run: |
                  set -euo pipefail
                  while IFS= read -r path; do
                    [ -z "$path" ] && continue
                    if [ ! -e "$path" ]; then
                      echo "::error::Sync removed path outside checks scope: $path"
                      exit 1
                    fi
                  done < <(git ls-files 'public/assets/**' ':(exclude)public/assets/checks/**')

            - name: Prepare PR body
              env:
                  CLONE_TAG: ${{ steps.tag.outputs.tag }}
                  STABLE_COMPARE_TAG: ${{ steps.tag.outputs.stable_tag }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
              run: |
                  set -euo pipefail
                  mkdir -p .github
                  RELEASE=$(jq -r .release .sync-summary.json)
                  BETA=$(jq -r .beta .sync-summary.json)
                  CHECKS=$(jq -r .checksCount .sync-summary.json)
                  BETA_CHECKS=$(jq -r .betaChecksCount .sync-summary.json)
                  ASSETS=$(jq -r .assetFiles .sync-summary.json)
                  IMAGES=$(jq -r .changelogImages .sync-summary.json)
                  CHANGELOGS=$(jq -r .changelogFiles .sync-summary.json)
                  {
                    echo "## MapsetVerifier content sync"
                    echo ""
                    echo "- **Clone tag:** ${CLONE_TAG}"
                    if [ -n "$STABLE_COMPARE_TAG" ] && [ "$STABLE_COMPARE_TAG" != "null" ]; then
                      echo "- **Stable comparison tag:** ${STABLE_COMPARE_TAG}"
                    fi
                    echo "- **Stable release:** ${RELEASE}"
                    echo "- **Beta release:** ${BETA}"
                    echo "- **Checks:** ${CHECKS}"
                    echo "- **Beta-only checks:** ${BETA_CHECKS}"
                    echo "- **Check asset files:** ${ASSETS}"
                    echo "- **Changelog images:** ${IMAGES}"
                    echo "- **Changelog files:** ${CHANGELOGS}"
                    echo ""
                    if [ -n "$SOURCE_RUN_URL" ] && [ "$SOURCE_RUN_URL" != "null" ]; then
                      echo "Triggered by MapsetVerifier release workflow: [source run](${SOURCE_RUN_URL})."
                      echo ""
                    fi
                    echo "Automated sync from [workflow run](${RUN_URL})."
                  } > .github/sync-pr-body.md

            - name: Commit and push
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin "$SYNC_BRANCH" 2>/dev/null || true
                  git checkout -B "$SYNC_BRANCH"
                  git add -A
                  git reset HEAD .sync-summary.json vendor .github/sync-pr-body.md 2>/dev/null || true
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                    exit 0
                  fi
                  git commit -m "chore: sync content from MapsetVerifier ${{ steps.tag.outputs.tag }}"
                  git fetch origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true
                  if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
                    if ! git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
                      echo "force-with-lease rejected; retrying with --force on dedicated sync branch"
                      git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"
                    fi
                  else
                    git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
                  fi

            - name: Create or update pull request
              id: pr
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  PR_TITLE="chore: sync MapsetVerifier content (${{ steps.tag.outputs.tag }})"
                  PR_NUMBER=$(gh pr list --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')
                  if [ -n "$PR_NUMBER" ]; then
                    gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file .github/sync-pr-body.md
                    echo "Updated PR #$PR_NUMBER"
                  else
                    gh pr create \
                      --head "$SYNC_BRANCH" \
                      --base main \
                      --title "$PR_TITLE" \
                      --body-file .github/sync-pr-body.md
                  fi

            - name: Report PR result
              if: steps.pr.outcome != 'success'
              run: |
                  echo "::error::Could not create or update the pull request."
                  echo "If the message mentions 'not permitted to create or approve pull requests', enable:"
                  echo "  Settings → Actions → General → Workflow permissions"
                  echo "  → Allow GitHub Actions to create and approve pull requests"
                  echo ""
                  echo "Open a PR manually: https://github.com/${{ github.repository }}/compare/main...${{ env.SYNC_BRANCH }}"
                  exit 1
